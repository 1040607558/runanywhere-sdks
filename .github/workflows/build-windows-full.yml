# ============================================================
# RunAnywhere SDK — Windows x64 自动构建
# CPU + CUDA 两组包，每组含 Debug + Release
# 能力：LLM + VLM + VAD + STT + TTS（全离线）
# ============================================================

name: Build Windows x64 (CPU + CUDA)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      build_cpu:
        description: 'Build CPU version'
        required: true
        default: 'true'
        type: boolean
      build_cuda:
        description: 'Build CUDA version'
        required: true
        default: 'true'
        type: boolean
      build_debug:
        description: 'Build Debug configurations'
        required: true
        default: 'false'
        type: boolean
      cuda_architectures:
        description: 'CUDA architectures (e.g. 75;86;89;90)'
        required: false
        default: '75;86;89;90'
        type: string

env:
  VCPKG_ROOT: C:\dev\vcpkg
  SHERPA_ONNX_VERSION: '1.13.2'
  CUDA_VERSION: '12.4'

jobs:
  # ============================================================
  # Job 1: CPU 版构建
  # ============================================================
  build-cpu:
    name: 'CPU Build'
    runs-on: windows-2022
    if: github.event.inputs.build_cpu == 'true'
    strategy:
      fail-fast: false
      matrix:
        build_type: ${{ fromJSON(github.event.inputs.build_debug == 'true' && '["Release", "Debug"]' || '["Release"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: choco install ninja -y

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ github.workspace }}/build_cpu_${{ matrix.build_type }}/vcpkg_installed
          key: vcpkg-cpu-${{ matrix.build_type }}-${{ hashFiles('**/vcpkg.json', '**/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-cpu-${{ matrix.build_type }}-

      - name: Setup vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ env.VCPKG_ROOT }}")) {
            git clone https://github.com/microsoft/vcpkg.git "${{ env.VCPKG_ROOT }}"
            & "${{ env.VCPKG_ROOT }}\bootstrap-vcpkg.bat" -disableMetrics
          } else {
            cd "${{ env.VCPKG_ROOT }}"
            git pull
            & ".\bootstrap-vcpkg.bat" -disableMetrics
          }

      - name: Install vcpkg deps
        shell: pwsh
        run: |
          ${{ env.VCPKG_ROOT }}\vcpkg.exe install `
            --triplet=x64-windows `
            protobuf nlohmann-json onnxruntime libarchive zlib bzip2 `
            cpp-httplib gtest openssl abseil usearch

      # ==================== 修复后：Sherpa-ONNX 下载解压 ====================
      - name: Download and setup Sherpa-ONNX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sherpaVersion = "${{ env.SHERPA_ONNX_VERSION }}"
          $sherpaUrl = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$sherpaVersion/sherpa-onnx-v$sherpaVersion-win-x64-shared-MD-Release.tar.bz2"
          $sherpaArchive = "${{ github.workspace }}\sherpa-onnx.tar.bz2"
          $thirdPartyDir = "${{ github.workspace }}\sdk\runanywhere-commons\third_party"

          # 核心修复：强制递归创建目标目录，解决 tar could not chdir 报错
          New-Item -ItemType Directory -Force -Path $thirdPartyDir | Out-Null
          Write-Host "✅ 目标目录已创建: $thirdPartyDir"

          Write-Host "Downloading Sherpa-ONNX $sherpaVersion..."

          # 下载重试机制，应对 GitHub 网络波动
          $maxRetries = 3
          $retryCount = 0
          while ($retryCount -lt $maxRetries) {
              try {
                  Invoke-WebRequest -Uri $sherpaUrl -OutFile $sherpaArchive -TimeoutSec 300 -UseBasicParsing
                  break
              } catch {
                  $retryCount++
                  Write-Host "下载失败，第 $retryCount 次重试..."
                  Start-Sleep -Seconds 5
                  if ($retryCount -eq $maxRetries) { throw "下载 Sherpa-ONNX 失败: $_" }
              }
          }

          Write-Host "Extracting..."
          tar -xjf $sherpaArchive -C $thirdPartyDir

          # 查找解压后的目录并重命名
          $extracted = Get-ChildItem -Path $thirdPartyDir -Directory -Filter "sherpa-onnx-v*win-x64*" | Select-Object -First 1
          if (-not $extracted) {
              Write-Host "❌ 未找到解压后的 sherpa-onnx 目录，当前目录内容："
              Get-ChildItem $thirdPartyDir | Format-Table Name
              exit 1
          }

          $dest = Join-Path $thirdPartyDir "sherpa-onnx-windows"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          Move-Item $extracted.FullName $dest
          Write-Host "Sherpa-ONNX extracted to: $dest"

          # 验证核心 lib 文件
          $libPath = Join-Path $dest "lib\sherpa-onnx-c-api.lib"
          if (Test-Path $libPath) {
              Write-Host "✅ Found sherpa-onnx-c-api.lib"
          } else {
              Write-Error "❌ sherpa-onnx-c-api.lib NOT FOUND at $libPath"
              Write-Host "目录下所有 .lib 文件："
              Get-ChildItem $dest -Recurse -Filter "*.lib" | ForEach-Object { Write-Host $_.FullName }
              exit 1
          }

      - name: Activate MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (CPU)
        shell: pwsh
        run: |
          $buildDir = "${{ github.workspace }}\build_cpu_${{ matrix.build_type }}"
          $sherpaDir = "${{ github.workspace }}\sdk\runanywhere-commons\third_party\sherpa-onnx-windows"

          if (-not (Test-Path "$sherpaDir\lib\sherpa-onnx-c-api.lib")) {
            throw "Sherpa lib not found: $sherpaDir\lib\sherpa-onnx-c-api.lib"
          }

          cmake -S . -B $buildDir `
            -G "Ninja" `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DRAC_BUILD_SHARED=ON `
            -DRAC_BUILD_BACKENDS=ON `
            -DRAC_BACKEND_LLAMACPP=ON `
            -DRAC_BACKEND_ONNX=ON `
            -DRAC_BUILD_CLI=ON `
            -DRAC_BUILD_TESTS=OFF `
            -DRAC_BUILD_SERVER=OFF `
            -DRAC_BUILD_JNI=OFF `
            -DGGML_CUDA=OFF `
            -DGGML_NATIVE=ON `
            -DSHERPA_ONNX_DIR="$sherpaDir" `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Verify RAC_BUILD_SHARED
        shell: pwsh
        run: |
          $cache = "${{ github.workspace }}\build_cpu_${{ matrix.build_type }}\CMakeCache.txt"
          if (Test-Path $cache) {
            $content = Get-Content $cache
            if ($content -match "RAC_BUILD_SHARED:BOOL=ON") {
              Write-Host "✅ RAC_BUILD_SHARED=ON"
            } else {
              Write-Error "❌ RAC_BUILD_SHARED is NOT ON"
              exit 1
            }
          }

      - name: Build
        shell: pwsh
        run: cmake --build "${{ github.workspace }}\build_cpu_${{ matrix.build_type }}" --parallel 4

      - name: Collect artifacts
        shell: pwsh
        run: |
          $buildDir = "${{ github.workspace }}\build_cpu_${{ matrix.build_type }}"
          $sherpaDir = "${{ github.workspace }}\sdk\runanywhere-commons\third_party\sherpa-onnx-windows"
          $outDir = "${{ github.workspace }}\dist-cpu-${{ matrix.build_type }}"
          New-Item -ItemType Directory -Force -Path "$outDir\lib", "$outDir\bin", "$outDir\include" | Out-Null

          Get-ChildItem "$buildDir" -Filter "*.lib" -Recurse | Copy-Item -Destination "$outDir\lib\" -Force
          Get-ChildItem "$buildDir" -Filter "*.dll" -Recurse | Copy-Item -Destination "$outDir\bin\" -Force
          Get-ChildItem "$buildDir" -Filter "*.exe" -Recurse | Copy-Item -Destination "$outDir\bin\" -Force

          if ("${{ matrix.build_type }}" -eq "Debug") {
            Get-ChildItem "$buildDir" -Filter "*.pdb" -Recurse | Copy-Item -Destination "$outDir\bin\" -Force
          }

          if (Test-Path "$sherpaDir\bin") {
            Get-ChildItem "$sherpaDir\bin\*.dll" | Copy-Item -Destination "$outDir\bin\" -Force
          }

          $onnxDll = "${{ env.VCPKG_ROOT }}\installed\x64-windows\bin\onnxruntime*.dll"
          Get-ChildItem $onnxDll -ErrorAction SilentlyContinue | Copy-Item -Destination "$outDir\bin\" -Force

          $includeSrc = "${{ github.workspace }}\sdk\runanywhere-commons\include"
          if (Test-Path $includeSrc) { Copy-Item -Recurse -Force $includeSrc "$outDir\include\" }

          $tagName = "${{ github.ref_name }}"
          $info = @"
RunAnywhere SDK — Windows x64 CPU (${{ matrix.build_type }})
Version: $tagName
Compute: CPU
Backends: llama.cpp (LLM+VLM), Sherpa-ONNX (VAD+STT+TTS)
"@
          $info | Out-File -FilePath "$outDir\BUILD_INFO.txt" -Encoding UTF8
          Write-Host "=== Artifacts collected ==="
          Get-ChildItem $outDir -Recurse | Format-Table FullName, Length

      - name: Package zip
        shell: pwsh
        run: |
          $outDir = "${{ github.workspace }}\dist-cpu-${{ matrix.build_type }}"
          $tagName = "${{ github.ref_name }}"
          $zipName = "runanywhere-sdks-windows-x64-cpu-${{ matrix.build_type }}-$tagName.zip"
          Compress-Archive -Path "$outDir\*" -DestinationPath "${{ github.workspace }}\$zipName" -Force
          $sha = (Get-FileHash "${{ github.workspace }}\$zipName" -Algorithm SHA256).Hash
          "$sha  $zipName" | Out-File -FilePath "${{ github.workspace }}\$zipName.sha256" -Encoding UTF8
          Write-Host "✅ Package: $zipName"
          Write-Host "SHA256: $sha"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: runanywhere-windows-x64-cpu-${{ matrix.build_type }}
          path: |
            runanywhere-sdks-windows-x64-cpu-${{ matrix.build_type }}-${{ github.ref_name }}.zip
            runanywhere-sdks-windows-x64-cpu-${{ matrix.build_type }}-${{ github.ref_name }}.zip.sha256

  # ============================================================
  # Job 2: CUDA 版构建
  # ============================================================
  build-cuda:
    name: 'CUDA Build'
    runs-on: windows-2022
    if: github.event.inputs.build_cuda == 'true'
    strategy:
      fail-fast: false
      matrix:
        build_type: ${{ fromJSON(github.event.inputs.build_debug == 'true' && '["Release", "Debug"]' || '["Release"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: choco install ninja -y

      - name: Install CUDA Toolkit (Release only)
        if: matrix.build_type == 'Release'
        uses: Jimver/cuda-toolkit@v0.2.21
        id: cuda
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "cudnn", "cufft", "cusparse"]'

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ github.workspace }}/build_cuda_${{ matrix.build_type }}/vcpkg_installed
          key: vcpkg-cuda-${{ matrix.build_type }}-${{ hashFiles('**/vcpkg.json', '**/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-cuda-${{ matrix.build_type }}-

      - name: Setup vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ env.VCPKG_ROOT }}")) {
            git clone https://github.com/microsoft/vcpkg.git "${{ env.VCPKG_ROOT }}"
            & "${{ env.VCPKG_ROOT }}\bootstrap-vcpkg.bat" -disableMetrics
          } else {
            cd "${{ env.VCPKG_ROOT }}"
            git pull
            & ".\bootstrap-vcpkg.bat" -disableMetrics
          }

      - name: Install vcpkg deps
        shell: pwsh
        run: |
          ${{ env.VCPKG_ROOT }}\vcpkg.exe install `
            --triplet=x64-windows `
            protobuf nlohmann-json onnxruntime libarchive zlib bzip2 `
            cpp-httplib gtest openssl abseil usearch

      # ==================== 修复后：Sherpa-ONNX 下载解压 ====================
      - name: Download and setup Sherpa-ONNX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sherpaVersion = "${{ env.SHERPA_ONNX_VERSION }}"
          $sherpaUrl = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$sherpaVersion/sherpa-onnx-v$sherpaVersion-win-x64-shared-MD-Release.tar.bz2"
          $sherpaArchive = "${{ github.workspace }}\sherpa-onnx.tar.bz2"
          $thirdPartyDir = "${{ github.workspace }}\sdk\runanywhere-commons\third_party"

          # 核心修复：强制递归创建目标目录
          New-Item -ItemType Directory -Force -Path $thirdPartyDir | Out-Null
          Write-Host "✅ 目标目录已创建: $thirdPartyDir"

          Write-Host "Downloading Sherpa-ONNX $sherpaVersion..."

          # 下载重试
          $maxRetries = 3
          $retryCount = 0
          while ($retryCount -lt $maxRetries) {
              try {
                  Invoke-WebRequest -Uri $sherpaUrl -OutFile $sherpaArchive -TimeoutSec 300 -UseBasicParsing
                  break
              } catch {
                  $retryCount++
                  Write-Host "下载失败，第 $retryCount 次重试..."
                  Start-Sleep -Seconds 5
                  if ($retryCount -eq $maxRetries) { throw "下载 Sherpa-ONNX 失败: $_" }
              }
          }

          Write-Host "Extracting..."
          tar -xjf $sherpaArchive -C $thirdPartyDir

          $extracted = Get-ChildItem -Path $thirdPartyDir -Directory -Filter "sherpa-onnx-v*win-x64*" | Select-Object -First 1
          if (-not $extracted) {
              Write-Host "❌ 未找到解压后的 sherpa-onnx 目录，当前目录内容："
              Get-ChildItem $thirdPartyDir | Format-Table Name
              exit 1
          }

          $dest = Join-Path $thirdPartyDir "sherpa-onnx-windows"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          Move-Item $extracted.FullName $dest
          Write-Host "Sherpa-ONNX extracted to: $dest"

          $libPath = Join-Path $dest "lib\sherpa-onnx-c-api.lib"
          if (Test-Path $libPath) {
              Write-Host "✅ Found sherpa-onnx-c-api.lib"
          } else {
              Write-Error "❌ sherpa-onnx-c-api.lib NOT FOUND at $libPath"
              Get-ChildItem $dest -Recurse -Filter "*.lib" | ForEach-Object { Write-Host $_.FullName }
              exit 1
          }

      - name: Activate MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (CUDA)
        shell: pwsh
        run: |
          $buildDir = "${{ github.workspace }}\build_cuda_${{ matrix.build_type }}"
          $sherpaDir = "${{ github.workspace }}\sdk\runanywhere-commons\third_party\sherpa-onnx-windows"

          # Debug 模式关闭 CUDA，避免编译过慢
          $cudaOn = "${{ matrix.build_type }}" -eq "Release"
          $cudaArch = "${{ github.event.inputs.cuda_architectures }}"
          if (-not $cudaArch) { $cudaArch = "75;86;89;90" }

          $cudaRoot = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${{ env.CUDA_VERSION }}"
          if (-not (Test-Path $cudaRoot)) {
            $cudaRoot = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4"
          }

          $cmakeArgs = @(
            "-S", ".",
            "-B", $buildDir,
            "-G", "Ninja",
            "-DCMAKE_C_COMPILER=cl",
            "-DCMAKE_CXX_COMPILER=cl",
            "-DCMAKE_BUILD_TYPE=${{ matrix.build_type }}",
            "-DRAC_BUILD_SHARED=ON",
            "-DRAC_BUILD_BACKENDS=ON",
            "-DRAC_BACKEND_LLAMACPP=ON",
            "-DRAC_BACKEND_ONNX=ON",
            "-DRAC_BUILD_CLI=ON",
            "-DRAC_BUILD_TESTS=OFF",
            "-DRAC_BUILD_SERVER=OFF",
            "-DRAC_BUILD_JNI=OFF",
            "-DGGML_NATIVE=ON",
            "-DSHERPA_ONNX_DIR=$sherpaDir",
            "-DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake",
            "-DVCPKG_TARGET_TRIPLET=x64-windows"
          )

          if ($cudaOn) {
            $cmakeArgs += "-DGGML_CUDA=ON"
            $cmakeArgs += "-DGGML_CUDA_F16=ON"
            $cmakeArgs += "-DCMAKE_CUDA_ARCHITECTURES=$cudaArch"
            $cmakeArgs += "-DCUDA_TOOLKIT_ROOT_DIR=$cudaRoot"
            $cmakeArgs += "-DCMAKE_CUDA_COMPILER=$cudaRoot\bin\nvcc.exe"
            Write-Host "🎮 CUDA enabled: $cudaArch"
          } else {
            $cmakeArgs += "-DGGML_CUDA=OFF"
            Write-Host "🖥️ CUDA disabled for Debug build"
          }

          & cmake @cmakeArgs

      - name: Verify configuration
        shell: pwsh
        run: |
          $cache = "${{ github.workspace }}\build_cuda_${{ matrix.build_type }}\CMakeCache.txt"
          if (Test-Path $cache) {
            $content = Get-Content $cache
            if ($content -match "RAC_BUILD_SHARED:BOOL=ON") {
              Write-Host "✅ RAC_BUILD_SHARED=ON"
            } else {
              Write-Error "❌ RAC_BUILD_SHARED is NOT ON"
              exit 1
            }
            if ("${{ matrix.build_type }}" -eq "Release") {
              if ($content -match "GGML_CUDA:BOOL=ON") {
                Write-Host "✅ GGML_CUDA=ON"
              } else {
                Write-Warning "⚠️ GGML_CUDA is OFF — building CPU-only"
              }
            }
          }

      - name: Build
        shell: pwsh
        run: cmake --build "${{ github.workspace }}\build_cuda_${{ matrix.build_type }}" --parallel 4

      - name: Collect artifacts
        shell: pwsh
        run: |
          $buildDir = "${{ github.workspace }}\build_cuda_${{ matrix.build_type }}"
          $sherpaDir = "${{ github.workspace }}\sdk\runanywhere-commons\third_party\sherpa-onnx-windows"
          $outDir = "${{ github.workspace }}\dist-cuda-${{ matrix.build_type }}"
          New-Item -ItemType Directory -Force -Path "$outDir\lib", "$outDir\bin", "$outDir\include" | Out-Null

          Get-ChildItem "$buildDir" -Filter "*.lib" -Recurse | Copy-Item -Destination "$outDir\lib\" -Force
          Get-ChildItem "$buildDir" -Filter "*.dll" -Recurse | Copy-Item -Destination "$outDir\bin\" -Force
          Get-ChildItem "$buildDir" -Filter "*.exe" -Recurse | Copy-Item -Destination "$outDir\bin\" -Force

          if ("${{ matrix.build_type }}" -eq "Debug") {
            Get-ChildItem "$buildDir" -Filter "*.pdb" -Recurse | Copy-Item -Destination "$outDir\bin\" -Force
          }

          # Release 模式才打包 CUDA 运行库
          if ("${{ matrix.build_type }}" -eq "Release") {
            $cudaBin = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${{ env.CUDA_VERSION }}\bin"
            if (Test-Path $cudaBin) {
              Get-ChildItem "$cudaBin\cudart64_*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$outDir\bin\" -Force
              Get-ChildItem "$cudaBin\cublas64_*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$outDir\bin\" -Force
              Get-ChildItem "$cudaBin\cublasLt64_*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$outDir\bin\" -Force
              Get-ChildItem "$cudaBin\cudnn64_*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$outDir\bin\" -Force
              Get-ChildItem "$cudaBin\cufft64_*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$outDir\bin\" -Force
              Get-ChildItem "$cudaBin\cusparse64_*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$outDir\bin\" -Force
            }
          }

          if (Test-Path "$sherpaDir\bin") {
            Get-ChildItem "$sherpaDir\bin\*.dll" | Copy-Item -Destination "$outDir\bin\" -Force
          }

          $onnxDll = "${{ env.VCPKG_ROOT }}\installed\x64-windows\bin\onnxruntime*.dll"
          Get-ChildItem $onnxDll -ErrorAction SilentlyContinue | Copy-Item -Destination "$outDir\bin\" -Force

          $includeSrc = "${{ github.workspace }}\sdk\runanywhere-commons\include"
          if (Test-Path $includeSrc) { Copy-Item -Recurse -Force $includeSrc "$outDir\include\" }

          $tagName = "${{ github.ref_name }}"
          $info = @"
RunAnywhere SDK — Windows x64 CUDA (${{ matrix.build_type }})
Version: $tagName
Compute: NVIDIA CUDA ${{ env.CUDA_VERSION }}
CUDA architectures: ${{ github.event.inputs.cuda_architectures || '75;86;89;90' }}
Backends: llama.cpp (LLM+VLM), Sherpa-ONNX (VAD+STT+TTS)
"@
          $info | Out-File -FilePath "$outDir\BUILD_INFO.txt" -Encoding UTF8
          Write-Host "=== Artifacts collected ==="
          Get-ChildItem $outDir -Recurse | Format-Table FullName, Length

      - name: Package zip
        shell: pwsh
        run: |
          $outDir = "${{ github.workspace }}\dist-cuda-${{ matrix.build_type }}"
          $tagName = "${{ github.ref_name }}"
          $zipName = "runanywhere-sdks-windows-x64-cuda-${{ matrix.build_type }}-$tagName.zip"
          Compress-Archive -Path "$outDir\*" -DestinationPath "${{ github.workspace }}\$zipName" -Force
          $sha = (Get-FileHash "${{ github.workspace }}\$zipName" -Algorithm SHA256).Hash
          "$sha  $zipName" | Out-File -FilePath "${{ github.workspace }}\$zipName.sha256" -Encoding UTF8
          Write-Host "✅ Package: $zipName"
          Write-Host "SHA256: $sha"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: runanywhere-windows-x64-cuda-${{ matrix.build_type }}
          path: |
            runanywhere-sdks-windows-x64-cuda-${{ matrix.build_type }}-${{ github.ref_name }}.zip
            runanywhere-sdks-windows-x64-cuda-${{ matrix.build_type }}-${{ github.ref_name }}.zip.sha256

  # ============================================================
  # Job 3: 发布到 GitHub Release
  # ============================================================
  publish-release:
    name: 'Publish to GitHub Release'
    runs-on: windows-2022
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/artifacts
          pattern: runanywhere-windows-x64-*
          merge-multiple: true

      - name: List files
        shell: pwsh
        run: |
          Get-ChildItem "${{ github.workspace }}/artifacts" -Filter "*.zip" | Format-Table Name, Length
          Get-ChildItem "${{ github.workspace }}/artifacts" -Filter "*.sha256" | Format-Table Name

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ github.workspace }}/artifacts/*.zip
            ${{ github.workspace }}/artifacts/*.sha256
          body: |
            ## RunAnywhere SDK — Windows x64 离线推理构建

            ### 📦 包列表
            | 包 | 计算 | 配置 |
            |---|---|---|
            | `runanywhere-sdks-windows-x64-cpu-release-*.zip` | CPU | Release |
            | `runanywhere-sdks-windows-x64-cpu-debug-*.zip` | CPU | Debug (PDB) |
            | `runanywhere-sdks-windows-x64-cuda-release-*.zip` | CUDA GPU | Release |
            | `runanywhere-sdks-windows-x64-cuda-debug-*.zip` | CUDA GPU | Debug (PDB) |

