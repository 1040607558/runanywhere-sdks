# ============================================================
# RunAnywhere SDK — Windows x64 自动构建
# 方案二：Visual Studio 17 2022 生成器 (MSBuild)
# CPU + CUDA 两组包，每组含 Debug + Release
# 能力：LLM + VLM + VAD + STT + TTS（全离线）
#
# vcpkg 缓存优化策略：
#   1. 锁定 vcpkg commit，避免 ABI 漂移
#   2. 启用二进制缓存（files 后端 + GHA 后端双写）
#   3. 重头包（onnxruntime/openssl/protobuf）独立缓存 key
#   4. 资产缓存（源码下载）独立缓存
#   5. 前置 vcpkg job 一次性安装，build job 直接复用
#
# ⚠️ 关键修复：所有 CMake Configure/Build 步骤使用 ilammy/msvc-dev-cmd
#    初始化 MSVC 环境，确保 cl.exe 在 PATH 中
# ============================================================

name: Build Windows x64 (CPU + CUDA)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      build_cpu:
        description: 'Build CPU version'
        required: true
        default: 'true'
        type: boolean
      build_cuda:
        description: 'Build CUDA version'
        required: true
        default: 'true'
        type: boolean
      build_debug:
        description: 'Build Debug configurations'
        required: true
        default: 'false'
        type: boolean
      cuda_architectures:
        description: 'CUDA architectures (e.g. 75;86;89;90)'
        required: false
        default: '75;86;89;90'
        type: string

# 全局权限：vcpkg GHA 缓存后端需要
permissions:
  actions: read
  contents: read

env:
  VCPKG_ROOT: C:\dev\vcpkg
  # 锁定 vcpkg 版本，避免每次 git pull 导致 ABI 失效、全量重编
  # ⚠️ 首次运行后，将下方 commit 替换为你验证通过的真实 commit
  VCPKG_COMMIT: '2024.01.12'
  # 二进制缓存：files 后端（actions/cache 持久化）+ GHA 后端
  VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite;files,${{ github.workspace }}\vcpkg_binary_cache,readwrite'
  # 资产缓存（源码下载）
  X_VCPKG_ASSET_SOURCES: 'clear;x-gha,readwrite'
  SHERPA_ONNX_VERSION: '1.13.2'
  CUDA_VERSION: '12.4'

jobs:
  # ============================================================
  # Job 0: 前置 vcpkg 依赖安装（CPU/CUDA 共用同一份编译产物）
  # 产出：vcpkg_installed + 二进制缓存，供后续 build job 复用
  # ============================================================
  vcpkg-deps:
    name: 'Install vcpkg dependencies'
    runs-on: windows-2022
    outputs:
      cache-hit: ${{ steps.cache-heavy.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 导出 GHA 缓存后端所需环境变量（vcpkg x-gha 源依赖）
      - name: Export GHA cache env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL)
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN)

      # 使用 GNU tar 避免 Windows BSD tar 处理含 .git 大目录时报错
      - name: Use GNU tar
        shell: cmd
        run: echo C:\Program Files\Git\usr\bin>>"%GITHUB_PATH%"

      # ---------- 缓存 1：vcpkg 源码 + 二进制缓存（files 后端） ----------
      - name: Cache vcpkg + binary cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ github.workspace }}\vcpkg_binary_cache
          key: vcpkg-root-x64-windows-${{ env.VCPKG_COMMIT }}-${{ hashFiles('**/vcpkg.json', '**/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-root-x64-windows-${{ env.VCPKG_COMMIT }}-

      # ---------- 缓存 2：重头包独立缓存（onnxruntime/openssl/protobuf） ----------
      - name: Cache heavy packages
        id: cache-heavy
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg_heavy_cache
          key: vcpkg-heavy-x64-windows-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-heavy-x64-windows-${{ env.VCPKG_COMMIT }}-

      # ---------- 缓存 3：vcpkg 源码下载目录 ----------
      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}\downloads
          key: vcpkg-downloads-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-

      # ---------- 安装/更新 vcpkg（锁定 commit） ----------
      - name: Setup vcpkg
        shell: cmd
        run: |
          if not exist "${{ env.VCPKG_ROOT }}" (
            git clone https://github.com/microsoft/vcpkg.git "${{ env.VCPKG_ROOT }}"
          )
          cd /d "${{ env.VCPKG_ROOT }}"
          git fetch --all --tags
          git checkout ${{ env.VCPKG_COMMIT }}
          call bootstrap-vcpkg.bat -disableMetrics
          vcpkg version

      # ---------- 安装重头包（独立二进制缓存目录） ----------
      - name: Install heavy packages (onnxruntime/openssl/protobuf)
        shell: cmd
        env:
          VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}\vcpkg_heavy_cache,readwrite'
        run: |
          ${{ env.VCPKG_ROOT }}\vcpkg.exe install ^
            --triplet=x64-windows ^
            --x-abi-tools-use-exact-versions ^
            onnxruntime openssl protobuf

      # ---------- 安装其余包（走 GHA 后端 + files 主缓存） ----------
      - name: Install remaining packages
        shell: cmd
        run: |
          ${{ env.VCPKG_ROOT }}\vcpkg.exe install ^
            --triplet=x64-windows ^
            --x-abi-tools-use-exact-versions ^
            nlohmann-json libarchive zlib bzip2 ^
            cpp-httplib gtest abseil usearch

      # ---------- 上传 vcpkg_installed 供 build job 下载 ----------
      - name: Upload vcpkg_installed
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-installed-x64-windows
          path: ${{ env.VCPKG_ROOT }}\installed\x64-windows
          retention-days: 1

  # ============================================================
  # Job 1: CPU 版构建（VS2022 生成器）
  # ============================================================
  build-cpu:
    name: 'CPU Build'
    runs-on: windows-2022
    needs: vcpkg-deps
    if: github.event.inputs.build_cpu == 'true'
    strategy:
      fail-fast: false
      matrix:
        build_type: ${{ fromJSON(contains(github.event.inputs.build_debug, 'true') && '["Release", "Debug"]' || '["Release"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ★ 关键修复 #1：使用 ilammy/msvc-dev-cmd 初始化 MSVC 环境
      # 此 Action 会自动设置 PATH、INCLUDE、LIB 等环境变量
      # 效果跨后续所有 step 持续生效
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 导出 GHA 缓存环境变量
      - name: Export GHA cache env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL)
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN)

      # 复用前置 job 装好的 vcpkg 依赖
      - name: Download vcpkg_installed
        uses: actions/download-artifact@v4
        with:
          name: vcpkg-installed-x64-windows
          path: ${{ env.VCPKG_ROOT }}\installed\x64-windows

      # 缓存 vcpkg 主目录（含二进制缓存），加速后续 job
      - name: Cache vcpkg (build job)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ github.workspace }}\vcpkg_binary_cache
          key: vcpkg-root-x64-windows-${{ env.VCPKG_COMMIT }}-${{ hashFiles('**/vcpkg.json', '**/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-root-x64-windows-${{ env.VCPKG_COMMIT }}-

      # 确保 vcpkg 存在并锁定版本
      - name: Ensure vcpkg bootstrapped
        shell: cmd
        run: |
          if not exist "${{ env.VCPKG_ROOT }}\vcpkg.exe" (
            if not exist "${{ env.VCPKG_ROOT }}" (
              git clone https://github.com/microsoft/vcpkg.git "${{ env.VCPKG_ROOT }}"
            )
            cd /d "${{ env.VCPKG_ROOT }}"
            git checkout ${{ env.VCPKG_COMMIT }}
            call bootstrap-vcpkg.bat -disableMetrics
          )
          ${{ env.VCPKG_ROOT }}\vcpkg.exe version

      # ==================== Sherpa-ONNX 下载解压 ====================
      - name: Download and setup Sherpa-ONNX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sherpaVersion = "${{ env.SHERPA_ONNX_VERSION }}"
          $sherpaUrl = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$sherpaVersion/sherpa-onnx-v$sherpaVersion-win-x64-shared-MD-Release.tar.bz2"
          $sherpaArchive = "${{ github.workspace }}\sherpa-onnx.tar.bz2"
          $thirdPartyDir = "${{ github.workspace }}\sdk\runanywhere-commons\third_party"

          New-Item -ItemType Directory -Force -Path $thirdPartyDir | Out-Null
          Write-Host "✅ 目标目录已创建: $thirdPartyDir"

          Write-Host "Downloading Sherpa-ONNX $sherpaVersion..."

          $maxRetries = 3
          $retryCount = 0
          while ($retryCount -lt $maxRetries) {
            try {
              Invoke-WebRequest -Uri $sherpaUrl -OutFile $sherpaArchive -TimeoutSec 300 -UseBasicParsing
              break
            } catch {
              $retryCount++
              Write-Host "下载失败，第 $retryCount 次重试..."
              Start-Sleep -Seconds 5
              if ($retryCount -eq $maxRetries) { throw "下载 Sherpa-ONNX 失败: $_" }
            }
          }

          Write-Host "Extracting..."
          tar -xjf $sherpaArchive -C $thirdPartyDir

          $extracted = Get-ChildItem -Path $thirdPartyDir -Directory -Filter "sherpa-onnx-v*win-x64*" | Select-Object -First 1
          if (-not $extracted) {
            Write-Host "❌ 未找到解压后的 sherpa-onnx 目录，当前目录内容："
            Get-ChildItem $thirdPartyDir | Format-Table Name
            exit 1
          }

          $dest = Join-Path $thirdPartyDir "sherpa-onnx-windows"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          Move-Item $extracted.FullName $dest
          Write-Host "Sherpa-ONNX extracted to: $dest"

          $libPath = Join-Path $dest "lib\sherpa-onnx-c-api.lib"
          if (Test-Path $libPath) {
            Write-Host "✅ Found sherpa-onnx-c-api.lib"
          } else {
            Write-Error "❌ sherpa-onnx-c-api.lib NOT FOUND at $libPath"
            Get-ChildItem $dest -Recurse -Filter "*.lib" | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

      # ==================== Configure (VS2022 生成器) ====================
      # ★ 关键修复 #2：不再手动 call VsDevCmd.bat
      #   ilammy/msvc-dev-cmd 已在前面设置好所有环境变量
      #   shell 用 cmd（比 pwsh 对 cmake 的 ^ 换行更友好）
      #   cmake 能直接在 PATH 中找到 cl.exe
      - name: Configure CMake (CPU) — Visual Studio 17 2022
        shell: cmd
        run: |
          echo 🔍 验证 MSVC 编译器是否在 PATH 中...
          where cl.exe || (echo ❌ cl.exe NOT FOUND & exit /b 1)
          echo ✅ cl.exe found

          set BUILD_DIR=${{ github.workspace }}\build_cpu
          set SHERPA_DIR=${{ github.workspace }}\sdk\runanywhere-commons\third_party\sherpa-onnx-windows

          if not exist "%SHERPA_DIR%\lib\sherpa-onnx-c-api.lib" (
            echo ❌ Sherpa lib not found: %SHERPA_DIR%\lib\sherpa-onnx-c-api.lib
            exit /b 1
          )

          if exist "%BUILD_DIR%" rmdir /s /q "%BUILD_DIR%"

          cmake -S . -B "%BUILD_DIR%" ^
            -G "Visual Studio 17 2022" ^
            -A x64 ^
            -DRAC_BUILD_SHARED=ON ^
            -DRAC_BUILD_BACKENDS=ON ^
            -DRAC_BACKEND_LLAMACPP=ON ^
            -DRAC_BACKEND_ONNX=ON ^
            -DRAC_BUILD_CLI=ON ^
            -DRAC_BUILD_TESTS=OFF ^
            -DRAC_BUILD_SERVER=OFF ^
            -DRAC_BUILD_JNI=OFF ^
            -DGGML_CUDA=OFF ^
            -DGGML_NATIVE=ON ^
            -DSHERPA_ONNX_DIR="%SHERPA_DIR%" ^
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Verify RAC_BUILD_SHARED
        shell: cmd
        run: |
          set CACHE=${{ github.workspace }}\build_cpu\CMakeCache.txt
          if exist "%CACHE%" (
            findstr /C:"RAC_BUILD_SHARED:BOOL=ON" "%CACHE%" >nul && (
              echo ✅ RAC_BUILD_SHARED=ON
            ) || (
              echo ❌ RAC_BUILD_SHARED is NOT ON
              exit /b 1
            )
          ) else (
            echo ❌ CMakeCache.txt not found
            exit /b 1
          )

      # ★ 关键修复 #3：Build 步骤不需要再 call VsDevCmd.bat
      #   ilammy/msvc-dev-cmd 设置的环境变量在整个 job 的所有 step 中持续有效
      - name: Build
        shell: cmd
        run: |
          echo 🔍 验证编译器可用性...
          where cl.exe || (echo ❌ cl.exe NOT FOUND & exit /b 1)
          cmake --build "${{ github.workspace }}\build_cpu" --config ${{ matrix.build_type }} --parallel 4

      - name: Collect artifacts
        shell: pwsh
        run: |
          $buildDir = "${{ github.workspace }}\build_cpu"
          $sherpaDir = "${{ github.workspace }}\sdk\runanywhere-commons\third_party\sherpa-onnx-windows"
          $outDir = "${{ github.workspace }}\dist-cpu-${{ matrix.build_type }}"
          New-Item -ItemType Directory -Force -Path "$outDir\lib", "$outDir\bin", "$outDir\include" | Out-Null

          # VS2022 多配置生成器：产物在 build_type 子目录
          Get-ChildItem "$buildDir\${{ matrix.build_type }}" -Filter "*.lib" -Recurse | Copy-Item -Destination "$outDir\lib\" -Force
          Get-ChildItem "$buildDir\${{ matrix.build_type }}" -Filter "*.dll" -Recurse | Copy-Item -Destination "$outDir\bin\" -Force
          Get-ChildItem "$buildDir\${{ matrix.build_type }}" -Filter "*.exe" -Recurse | Copy-Item -Destination "$outDir\bin\" -Force

          if ("${{ matrix.build_type }}" -eq "Debug") {
            Get-ChildItem "$buildDir\${{ matrix.build_type }}" -Filter "*.pdb" -Recurse | Copy-Item -Destination "$outDir\bin\" -Force
          }

          if (Test-Path "$sherpaDir\bin") {
            Get-ChildItem "$sherpaDir\bin\*.dll" | Copy-Item -Destination "$outDir\bin\" -Force
          }

          $onnxDll = "${{ env.VCPKG_ROOT }}\installed\x64-windows\bin\onnxruntime*.dll"
          Get-ChildItem $onnxDll -ErrorAction SilentlyContinue | Copy-Item -Destination "$outDir\bin\" -Force

          $includeSrc = "${{ github.workspace }}\sdk\runanywhere-commons\include"
          if (Test-Path $includeSrc) { Copy-Item -Recurse -Force $includeSrc "$outDir\include\" }

          $tagName = "${{ github.ref_name }}"
          $lines = @(
            "RunAnywhere SDK — Windows x64 CPU (${{ matrix.build_type }})",
            "Version: $tagName",
            "Compute: CPU",
            "Compiler: Visual Studio 2022 (v143)",
            "Backends: llama.cpp (LLM+VLM), Sherpa-ONNX (VAD+STT+TTS)"
          )
          $lines -join "`r`n" | Out-File -FilePath "$outDir\BUILD_INFO.txt" -Encoding UTF8
          Write-Host "=== Artifacts collected ==="
          Get-ChildItem $outDir -Recurse | Format-Table FullName, Length

      - name: Package zip
        shell: pwsh
        run: |
          $outDir = "${{ github.workspace }}\dist-cpu-${{ matrix.build_type }}"
          $tagName = "${{ github.ref_name }}"
          $zipName = "runanywhere-sdks-windows-x64-cpu-${{ matrix.build_type }}-$tagName.zip"
          Compress-Archive -Path "$outDir\*" -DestinationPath "${{ github.workspace }}\$zipName" -Force
          $sha = (Get-FileHash "${{ github.workspace }}\$zipName" -Algorithm SHA256).Hash
          "$sha  $zipName" | Out-File -FilePath "${{ github.workspace }}\$zipName.sha256" -Encoding UTF8
          Write-Host "✅ Package: $zipName"
          Write-Host "SHA256: $sha"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: runanywhere-windows-x64-cpu-${{ matrix.build_type }}
          path: |
            runanywhere-sdks-windows-x64-cpu-${{ matrix.build_type }}-${{ github.ref_name }}.zip
            runanywhere-sdks-windows-x64-cpu-${{ matrix.build_type }}-${{ github.ref_name }}.zip.sha256

  # ============================================================
  # Job 2: CUDA 版构建（VS2022 生成器）
  # ============================================================
  build-cuda:
    name: 'CUDA Build'
    runs-on: windows-2022
    needs: vcpkg-deps
    if: github.event.inputs.build_cuda == 'true'
    strategy:
      fail-fast: false
      matrix:
        build_type: ${{ fromJSON(contains(github.event.inputs.build_debug, 'true') && '["Release", "Debug"]' || '["Release"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ★ 关键修复 #4：CUDA job 也必须初始化 MSVC 环境
      #   nvcc 需要 cl.exe 作为 host compiler
      #   必须在 CUDA Toolkit 安装之前初始化
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA Toolkit (Release only)
        if: matrix.build_type == 'Release'
        uses: Jimver/cuda-toolkit@v0.2.21
        id: cuda
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "cudnn", "cufft", "cusparse"]'

      # 导出 GHA 缓存环境变量
      - name: Export GHA cache env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL)
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN)

      # 复用前置 job 装好的 vcpkg 依赖
      - name: Download vcpkg_installed
        uses: actions/download-artifact@v4
        with:
          name: vcpkg-installed-x64-windows
          path: ${{ env.VCPKG_ROOT }}\installed\x64-windows

      # 缓存 vcpkg 主目录
      - name: Cache vcpkg (build job)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ github.workspace }}\vcpkg_binary_cache
          key: vcpkg-root-x64-windows-${{ env.VCPKG_COMMIT }}-${{ hashFiles('**/vcpkg.json', '**/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-root-x64-windows-${{ env.VCPKG_COMMIT }}-

      # 确保 vcpkg 存在并锁定版本
      - name: Ensure vcpkg bootstrapped
        shell: cmd
        run: |
          if not exist "${{ env.VCPKG_ROOT }}\vcpkg.exe" (
            if not exist "${{ env.VCPKG_ROOT }}" (
              git clone https://github.com/microsoft/vcpkg.git "${{ env.VCPKG_ROOT }}"
            )
            cd /d "${{ env.VCPKG_ROOT }}"
            git checkout ${{ env.VCPKG_COMMIT }}
            call bootstrap-vcpkg.bat -disableMetrics
          )
          ${{ env.VCPKG_ROOT }}\vcpkg.exe version

      # ==================== Sherpa-ONNX 下载解压 ====================
      - name: Download and setup Sherpa-ONNX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sherpaVersion = "${{ env.SHERPA_ONNX_VERSION }}"
          $sherpaUrl = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$sherpaVersion/sherpa-onnx-v$sherpaVersion-win-x64-shared-MD-Release.tar.bz2"
          $sherpaArchive = "${{ github.workspace }}\sherpa-onnx.tar.bz2"
          $thirdPartyDir = "${{ github.workspace }}\sdk\runanywhere-commons\third_party"

          New-Item -ItemType Directory -Force -Path $thirdPartyDir | Out-Null
          Write-Host "✅ 目标目录已创建: $thirdPartyDir"

          Write-Host "Downloading Sherpa-ONNX $sherpaVersion..."

          $maxRetries = 3
          $retryCount = 0
          while ($retryCount -lt $maxRetries) {
            try {
              Invoke-WebRequest -Uri $sherpaUrl -OutFile $sherpaArchive -TimeoutSec 300 -UseBasicParsing
              break
            } catch {
              $retryCount++
              Write-Host "下载失败，第 $retryCount 次重试..."
              Start-Sleep -Seconds 5
              if ($retryCount -eq $maxRetries) { throw "下载 Sherpa-ONNX 失败: $_" }
            }
          }

          Write-Host "Extracting..."
          tar -xjf $sherpaArchive -C $thirdPartyDir

          $extracted = Get-ChildItem -Path $thirdPartyDir -Directory -Filter "sherpa-onnx-v*win-x64*" | Select-Object -First 1
          if (-not $extracted) {
            Write-Host "❌ 未找到解压后的 sherpa-onnx 目录，当前目录内容："
            Get-ChildItem $thirdPartyDir | Format-Table Name
            exit 1
          }

          $dest = Join-Path $thirdPartyDir "sherpa-onnx-windows"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          Move-Item $extracted.FullName $dest
          Write-Host "Sherpa-ONNX extracted to: $dest"

          $libPath = Join-Path $dest "lib\sherpa-onnx-c-api.lib"
          if (Test-Path $libPath) {
            Write-Host "✅ Found sherpa-onnx-c-api.lib"
          } else {
            Write-Error "❌ sherpa-onnx-c-api.lib NOT FOUND at $libPath"
            Get-ChildItem $dest -Recurse -Filter "*.lib" | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

      # ==================== Configure (VS2022 生成器 + CUDA) ====================
      # ★ 关键修复 #5：不再手动 call VsDevCmd.bat
      #   ilammy/msvc-dev-cmd 已设置好 MSVC 环境
      #   CUDA Toolkit 已安装在前面（顺序很重要：先 MSVC，再 CUDA）
      - name: Configure CMake (CUDA) — Visual Studio 17 2022
        shell: cmd
        run: |
          echo 🔍 验证编译器...
          where cl.exe || (echo ❌ cl.exe NOT FOUND & exit /b 1)
          echo ✅ cl.exe found

          set BUILD_DIR=${{ github.workspace }}\build_cuda
          set SHERPA_DIR=${{ github.workspace }}\sdk\runanywhere-commons\third_party\sherpa-onnx-windows
          set CUDA_ROOT=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${{ env.CUDA_VERSION }}

          if not exist "%CUDA_ROOT%" set CUDA_ROOT=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4

          if not exist "%CUDA_ROOT%\bin\nvcc.exe" (
            echo ⚠️ nvcc.exe not found at %CUDA_ROOT%\bin\nvcc.exe
            echo This is expected for Debug builds where CUDA is OFF
          )

          if not exist "%SHERPA_DIR%\lib\sherpa-onnx-c-api.lib" (
            echo ❌ Sherpa lib not found: %SHERPA_DIR%\lib\sherpa-onnx-c-api.lib
            exit /b 1
          )

          if exist "%BUILD_DIR%" rmdir /s /q "%BUILD_DIR%"

          set CUDA_ON=${{ matrix.build_type }}
          if "%CUDA_ON%"=="Release" (
            set GGML_CUDA=ON
          ) else (
            set GGML_CUDA=OFF
          )

          echo 🎮 CUDA mode: %GGML_CUDA%  arch: ${{ github.event.inputs.cuda_architectures || '75;86;89;90' }}

          cmake -S . -B "%BUILD_DIR%" ^
            -G "Visual Studio 17 2022" ^
            -A x64 ^
            -DRAC_BUILD_SHARED=ON ^
            -DRAC_BUILD_BACKENDS=ON ^
            -DRAC_BACKEND_LLAMACPP=ON ^
            -DRAC_BACKEND_ONNX=ON ^
            -DRAC_BUILD_CLI=ON ^
            -DRAC_BUILD_TESTS=OFF ^
            -DRAC_BUILD_SERVER=OFF ^
            -DRAC_BUILD_JNI=OFF ^
            -DGGML_CUDA=%GGML_CUDA% ^
            -DGGML_CUDA_F16=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=${{ github.event.inputs.cuda_architectures || '75;86;89;90' }} ^
            -DCMAKE_CUDA_COMPILER="%CUDA_ROOT%\bin\nvcc.exe" ^
            -DCUDA_TOOLKIT_ROOT_DIR="%CUDA_ROOT%" ^
            -DGGML_NATIVE=ON ^
            -DSHERPA_ONNX_DIR="%SHERPA_DIR%" ^
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Verify configuration
        shell: cmd
        run: |
          set CACHE=${{ github.workspace }}\build_cuda\CMakeCache.txt
          if exist "%CACHE%" (
            findstr /C:"RAC_BUILD_SHARED:BOOL=ON" "%CACHE%" >nul && (
              echo ✅ RAC_BUILD_SHARED=ON
            ) || (
              echo ❌ RAC_BUILD_SHARED is NOT ON
              exit /b 1
            )
            if "${{ matrix.build_type }}"=="Release" (
              findstr /C:"GGML_CUDA:BOOL=ON" "%CACHE%" >nul && (
                echo ✅ GGML_CUDA=ON
              ) || (
                echo ⚠️ GGML_CUDA is OFF — building CPU-only
              )
            )
          ) else (
            echo ❌ CMakeCache.txt not found
            exit /b 1
          )

      # ★ 关键修复 #6：Build 步骤不需要再 call VsDevCmd.bat
      - name: Build
        shell: cmd
        run: |
          echo 🔍 验证编译器...
          where cl.exe || (echo ❌ cl.exe NOT FOUND & exit /b 1)
          cmake --build "${{ github.workspace }}\build_cuda" --config ${{ matrix.build_type }} --parallel 4

      - name: Collect artifacts
        shell: pwsh
        run: |
          $buildDir = "${{ github.workspace }}\build_cuda"
          $sherpaDir = "${{ github.workspace }}\sdk\runanywhere-commons\third_party\sherpa-onnx-windows"
          $outDir = "${{ github.workspace }}\dist-cuda-${{ matrix.build_type }}"
          New-Item -ItemType Directory -Force -Path "$outDir\lib", "$outDir\bin", "$outDir\include" | Out-Null

          Get-ChildItem "$buildDir\${{ matrix.build_type }}" -Filter "*.lib" -Recurse | Copy-Item -Destination "$outDir\lib\" -Force
          Get-ChildItem "$buildDir\${{ matrix.build_type }}" -Filter "*.dll" -Recurse | Copy-Item -Destination "$outDir\bin\" -Force
          Get-ChildItem "$buildDir\${{ matrix.build_type }}" -Filter "*.exe" -Recurse | Copy-Item -Destination "$outDir\bin\" -Force

          if ("${{ matrix.build_type }}" -eq "Debug") {
            Get-ChildItem "$buildDir\${{ matrix.build_type }}" -Filter "*.pdb" -Recurse | Copy-Item -Destination "$outDir\bin\" -Force
          }

          if ("${{ matrix.build_type }}" -eq "Release") {
            $cudaBin = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${{ env.CUDA_VERSION }}\bin"
            if (Test-Path $cudaBin) {
              Get-ChildItem "$cudaBin\cudart64_*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$outDir\bin\" -Force
              Get-ChildItem "$cudaBin\cublas64_*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$outDir\bin\" -Force
              Get-ChildItem "$cudaBin\cublasLt64_*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$outDir\bin\" -Force
              Get-ChildItem "$cudaBin\cudnn64_*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$outDir\bin\" -Force
              Get-ChildItem "$cudaBin\cufft64_*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$outDir\bin\" -Force
              Get-ChildItem "$cudaBin\cusparse64_*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$outDir\bin\" -Force
            }
          }

          if (Test-Path "$sherpaDir\bin") {
            Get-ChildItem "$sherpaDir\bin\*.dll" | Copy-Item -Destination "$outDir\bin\" -Force
          }

          $onnxDll = "${{ env.VCPKG_ROOT }}\installed\x64-windows\bin\onnxruntime*.dll"
          Get-ChildItem $onnxDll -ErrorAction SilentlyContinue | Copy-Item -Destination "$outDir\bin\" -Force

          $includeSrc = "${{ github.workspace }}\sdk\runanywhere-commons\include"
          if (Test-Path $includeSrc) { Copy-Item -Recurse -Force $includeSrc "$outDir\include\" }

          $tagName = "${{ github.ref_name }}"
          $cudaArch = "${{ github.event.inputs.cuda_architectures || '75;86;89;90' }}"
          $lines = @(
            "RunAnywhere SDK — Windows x64 CUDA (${{ matrix.build_type }})",
            "Version: $tagName",
            "Compute: NVIDIA CUDA ${{ env.CUDA_VERSION }}",
            "CUDA architectures: $cudaArch",
            "Compiler: Visual Studio 2022 (v143)",
            "Backends: llama.cpp (LLM+VLM), Sherpa-ONNX (VAD+STT+TTS)"
          )
          $lines -join "`r`n" | Out-File -FilePath "$outDir\BUILD_INFO.txt" -Encoding UTF8
          Write-Host "=== Artifacts collected ==="
          Get-ChildItem $outDir -Recurse | Format-Table FullName, Length

      - name: Package zip
        shell: pwsh
        run: |
          $outDir = "${{ github.workspace }}\dist-cuda-${{ matrix.build_type }}"
          $tagName = "${{ github.ref_name }}"
          $zipName = "runanywhere-sdks-windows-x64-cuda-${{ matrix.build_type }}-$tagName.zip"
          Compress-Archive -Path "$outDir\*" -DestinationPath "${{ github.workspace }}\$zipName" -Force
          $sha = (Get-FileHash "${{ github.workspace }}\$zipName" -Algorithm SHA256).Hash
          "$sha  $zipName" | Out-File -FilePath "${{ github.workspace }}\$zipName.sha256" -Encoding UTF8
          Write-Host "✅ Package: $zipName"
          Write-Host "SHA256: $sha"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: runanywhere-windows-x64-cuda-${{ matrix.build_type }}
          path: |
            runanywhere-sdks-windows-x64-cuda-${{ matrix.build_type }}-${{ github.ref_name }}.zip
            runanywhere-sdks-windows-x64-cuda-${{ matrix.build_type }}-${{ github.ref_name }}.zip.sha256

  # ============================================================
  # Job 3: 发布到 GitHub Release
  # ============================================================
  publish-release:
    name: 'Publish to GitHub Release'
    runs-on: windows-2022
    needs: [build-cpu, build-cuda]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/artifacts
          pattern: runanywhere-windows-x64-*
          merge-multiple: true

      - name: List files
        shell: pwsh
        run: |
          Get-ChildItem "${{ github.workspace }}/artifacts" -Filter "*.zip" | Format-Table Name, Length
          Get-ChildItem "${{ github.workspace }}/artifacts" -Filter "*.sha256" | Format-Table Name

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ github.workspace }}/artifacts/*.zip
            ${{ github.workspace }}/artifacts/*.sha256
          body: |
            ## RunAnywhere SDK — Windows x64 离线推理构建

            ### 📦 包列表
            | 包 | 计算 | 配置 |
            |---|---|---|
            | `runanywhere-sdks-windows-x64-cpu-release-*.zip` | CPU | Release |
            | `runanywhere-sdks-windows-x64-cpu-debug-*.zip` | CPU | Debug (PDB) |
            | `runanywhere-sdks-windows-x64-cuda-release-*.zip` | CUDA GPU | Release |
            | `runanywhere-sdks-windows-x64-cuda-debug-*.zip` | CUDA GPU | Debug (PDB) |

            ### 🧠 能力矩阵
            | 能力 | CPU | CUDA |
            |---|:---:|:---:|
            | LLM 文本大模型 | ✅ | ✅⚡ |
            | VLM 多模态图文 | ✅ | ✅⚡ |
            | VAD + STT + TTS | ✅ | ✅ |
            | 全离线推理 | ✅ | ✅ |

            > **Compiler**: Visual Studio 2022 (v143) + MSBuild  
            > **注意**：CUDA 包附带部分 CUDA 运行库；终端部署环境建议安装对应版本 CUDA Runtime 以获得完整兼容性。  
            > Debug 包仅用于调试排查，生产环境请使用 Release 版本。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
