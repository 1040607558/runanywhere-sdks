name: Build Windows x64 (MSVC + Ninja)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      build_rcli:
        description: 'Build rcli.exe'
        type: boolean
        default: true
      build_shared:
        description: 'Build shared libs (RAC_BUILD_SHARED)'
        type: boolean
        default: true
      upload_artifacts:
        description: 'Upload build artifacts'
        type: boolean
        default: true

env:
  VCPKG_ROOT: C:\dev\vcpkg
  SHERPA_ONNX_VERSION: 1.13.2
  SHERPA_ONNX_DIR: ${{ github.workspace }}\sdk\runanywhere-commons\third_party\sherpa-onnx-windows

jobs:
  # ============================================================
  # Job 1: 完整 SDK 构建 (MSVC + Ninja)
  # ============================================================
  build-windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ---------- 安装 Ninja ----------
      - name: Install Ninja
        run: |
          choco install ninja -y
          ninja --version
        shell: powershell

      # ---------- 安装 vcpkg ----------
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-windows-msvc-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-msvc-

      - name: Install vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          if (-not (Test-Path "${{ env.VCPKG_ROOT }}")) {
            git clone https://github.com/microsoft/vcpkg.git "${{ env.VCPKG_ROOT }}"
          }
          & "${{ env.VCPKG_ROOT }}\bootstrap-vcpkg.bat" -disableMetrics
        shell: powershell

      - name: Verify vcpkg
        run: |
          & "${{ env.VCPKG_ROOT }}\vcpkg.exe" version
        shell: powershell

      # ---------- 安装 vcpkg 依赖 ----------
      - name: Install vcpkg dependencies
        run: |
          $vcpkg = "${{ env.VCPKG_ROOT }}\vcpkg.exe"
          & $vcpkg install --triplet=x64-windows `
            protobuf:x64-windows `
            nlohmann-json:x64-windows `
            onnxruntime:x64-windows `
            libarchive:x64-windows `
            zlib:x64-windows `
            bzip2:x64-windows `
            cpp-httplib:x64-windows `
            gtest:x64-windows `
            openssl:x64-windows `
            abseil:x64-windows
        shell: powershell

      # ---------- 下载 Sherpa-ONNX 1.13.2 ----------
      - name: Download Sherpa-ONNX
        run: |
          $sherpaUrl = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${{ env.SHERPA_ONNX_VERSION }}/sherpa-onnx-v${{ env.SHERPA_ONNX_VERSION }}-win-x64-shared-MD-Release.tar.bz2"
          $sherpaArchive = "${{ github.workspace }}\sherpa-onnx.tar.bz2"
          $thirdPartyDir = "${{ github.workspace }}\sdk\runanywhere-commons\third_party"

          Write-Host "Downloading Sherpa-ONNX ${{ env.SHERPA_ONNX_VERSION }}..."
          Invoke-WebRequest -Uri $sherpaUrl -OutFile $sherpaArchive

          Write-Host "Extracting..."
          # 用 tar（Windows 10+ 自带）解压 .tar.bz2
          tar -xjf $sherpaArchive -C $thirdPartyDir

          # 重命名为 sherpa-onnx-windows
          $extracted = Get-ChildItem -Path $thirdPartyDir -Directory -Filter "sherpa-onnx-v*win-x64*" | Select-Object -First 1
          if ($extracted) {
            $dest = Join-Path $thirdPartyDir "sherpa-onnx-windows"
            if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
            Move-Item $extracted.FullName $dest
            Write-Host "Sherpa-ONNX extracted to: $dest"
          }

          # 验证
          $libPath = Join-Path $thirdPartyDir "sherpa-onnx-windows\lib\sherpa-onnx-c-api.lib"
          if (Test-Path $libPath) {
            Write-Host "✅ Found sherpa-onnx-c-api.lib"
          } else {
            Write-Error "❌ sherpa-onnx-c-api.lib NOT FOUND at $libPath"
            Get-ChildItem $thirdPartyDir\sherpa-onnx-windows -Recurse -Filter "*.lib" | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
        shell: powershell

      # ---------- CMake 配置 (Ninja + MSVC) ----------
      - name: Configure CMake (Ninja + MSVC)
        run: |
          cmake -S . -B build_windows `
            -G "Ninja" `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_BUILD_TYPE=Release `
            -DRAC_BUILD_SHARED=${{ github.event.inputs.build_shared || 'ON' }} `
            -DRAC_BUILD_CLI=${{ github.event.inputs.build_rcli || 'ON' }} `
            -DRAC_BUILD_TESTS=OFF `
            -DRAC_BUILD_SERVER=OFF `
            -DRAC_BUILD_JNI=OFF `
            -DSHERPA_ONNX_DIR="${{ env.SHERPA_ONNX_DIR }}" `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
        shell: powershell

      # ---------- 验证关键配置 ----------
      - name: Verify configuration
        run: |
          $cacheFile = "${{ github.workspace }}\build_windows\CMakeCache.txt"
          Get-Content $cacheFile | Select-String "RAC_BUILD_SHARED|BUILD_SHARED|CMAKE_GENERATOR"
          Write-Host "---"
          Write-Host "If RAC_BUILD_SHARED=ON, plugins will be ON-shared"
          Write-Host "If RAC_BUILD_SHARED=OFF, all engine plugins will be skipped!"
        shell: powershell

      # ---------- 编译 ----------
      - name: Build
        run: |
          cmake --build build_windows --config Release --parallel 4
        shell: powershell

      # ---------- 收集产物 ----------
      - name: Collect artifacts
        run: |
          $outDir = "${{ github.workspace }}\build_windows\Release"
          $collectDir = "${{ github.workspace }}\dist"
          New-Item -ItemType Directory -Path $collectDir -Force | Out-Null

          # 复制所有 DLL
          Get-ChildItem -Path $outDir -Filter "*.dll" -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination $collectDir -Force
          }

          # 复制 rcli.exe
          Get-ChildItem -Path $outDir -Filter "rcli.exe" -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination $collectDir -Force
          }

          # 复制 sherpa-onnx DLL（运行时需要）
          $sherpaBin = "${{ env.SHERPA_ONNX_DIR }}\bin"
          if (Test-Path $sherpaBin) {
            Get-ChildItem -Path $sherpaBin -Filter "*.dll" | ForEach-Object {
              Copy-Item $_.FullName -Destination $collectDir -Force
            }
          }

          # 复制 onnxruntime DLL
          $ortBin = "${{ env.VCPKG_ROOT }}\installed\x64-windows\bin"
          if (Test-Path $ortBin) {
            Get-ChildItem -Path $ortBin -Filter "onnxruntime*.dll" | ForEach-Object {
              Copy-Item $_.FullName -Destination $collectDir -Force
            }
          }

          # 列出所有收集的文件
          Write-Host "=== Collected artifacts ==="
          Get-ChildItem $collectDir | ForEach-Object { Write-Host $_.Name }
        shell: powershell

      # ---------- 打包 zip ----------
      - name: Package zip
        id: package
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if (-not $version) { $version = "dev" }
          $zipName = "runanywhere-sdks-windows-msvc-ninja-${{ github.sha }}.zip"
          $zipPath = "${{ github.workspace }}\$zipName"

          Compress-Archive -Path "${{ github.workspace }}\dist\*" -DestinationPath $zipPath -Force

          # 计算 SHA256
          $sha = (Get-FileHash $zipPath -Algorithm SHA256).Hash
          $shaPath = "$zipPath.sha256"
          Set-Content -Path $shaPath -Value "$sha  $zipName"

          Write-Host "=== SHA256 ==="
          Get-Content $shaPath

          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          echo "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
        shell: powershell

      # ---------- 上传 Artifact ----------
      - name: Upload build artifact
        if: ${{ github.event.inputs.upload_artifacts != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: runanywhere-sdks-windows-msvc-ninja
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.zip_path }}.sha256
          retention-days: 30

      # ---------- 上传到 GitHub Release ----------
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.zip_path }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # Job 2: 仅构建 rcli.exe（轻量快速）
  # ============================================================
  build-rcli-msvc:
    runs-on: windows-latest
    timeout-minutes: 180
    if: ${{ github.event.inputs.build_rcli != 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Ninja
        run: |
          choco install ninja -y
        shell: powershell

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-windows-msvc-rcli-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-msvc-rcli-
            vcpkg-windows-msvc-

      - name: Install vcpkg
        run: |
          if (-not (Test-Path "${{ env.VCPKG_ROOT }}")) {
            git clone https://github.com/microsoft/vcpkg.git "${{ env.VCPKG_ROOT }}"
          }
          & "${{ env.VCPKG_ROOT }}\bootstrap-vcpkg.bat" -disableMetrics
        shell: powershell

      - name: Install minimal vcpkg deps for rcli
        run: |
          $vcpkg = "${{ env.VCPKG_ROOT }}\vcpkg.exe"
          & $vcpkg install --triplet=x64-windows `
            protobuf:x64-windows `
            nlohmann-json:x64-windows `
            onnxruntime:x64-windows `
            libarchive:x64-windows `
            zlib:x64-windows `
            cpp-httplib:x64-windows
        shell: powershell

      - name: Download Sherpa-ONNX
        run: |
          $sherpaUrl = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${{ env.SHERPA_ONNX_VERSION }}/sherpa-onnx-v${{ env.SHERPA_ONNX_VERSION }}-win-x64-shared-MD-Release.tar.bz2"
          $sherpaArchive = "${{ github.workspace }}\sherpa-onnx.tar.bz2"
          $thirdPartyDir = "${{ github.workspace }}\sdk\runanywhere-commons\third_party"

          Invoke-WebRequest -Uri $sherpaUrl -OutFile $sherpaArchive
          tar -xjf $sherpaArchive -C $thirdPartyDir

          $extracted = Get-ChildItem -Path $thirdPartyDir -Directory -Filter "sherpa-onnx-v*win-x64*" | Select-Object -First 1
          if ($extracted) {
            $dest = Join-Path $thirdPartyDir "sherpa-onnx-windows"
            if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
            Move-Item $extracted.FullName $dest
          }
          Write-Host "Sherpa-ONNX ready at: $dest"
        shell: powershell

      - name: Configure CMake (rcli only)
        run: |
          cmake -S . -B build_rcli `
            -G "Ninja" `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_BUILD_TYPE=Release `
            -DRAC_BUILD_SHARED=ON `
            -DRAC_BUILD_CLI=ON `
            -DRAC_BUILD_TESTS=OFF `
            -DRAC_BUILD_SERVER=OFF `
            -DRAC_BUILD_JNI=OFF `
            -DSHERPA_ONNX_DIR="${{ env.SHERPA_ONNX_DIR }}" `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
        shell: powershell

      - name: Build rcli
        run: |
          cmake --build build_rcli --config Release --parallel 4
        shell: powershell

      - name: Package rcli
        run: |
          $rcliDir = "${{ github.workspace }}\rcli-dist"
          New-Item -ItemType Directory -Path $rcliDir -Force | Out-Null

          # 找 rcli.exe
          Get-ChildItem -Path "${{ github.workspace }}\build_rcli" -Filter "rcli.exe" -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination $rcliDir -Force
          }

          # 复制运行时 DLL
          $sherpaBin = "${{ env.SHERPA_ONNX_DIR }}\bin"
          if (Test-Path $sherpaBin) {
            Get-ChildItem -Path $sherpaBin -Filter "*.dll" | ForEach-Object {
              Copy-Item $_.FullName -Destination $rcliDir -Force
            }
          }

          $ortBin = "${{ env.VCPKG_ROOT }}\installed\x64-windows\bin"
          if (Test-Path $ortBin) {
            Get-ChildItem -Path $ortBin -Filter "onnxruntime*.dll" | ForEach-Object {
              Copy-Item $_.FullName -Destination $rcliDir -Force
            }
          }

          $zipName = "rcli-windows-msvc-ninja.zip"
          $zipPath = "${{ github.workspace }}\$zipName"
          Compress-Archive -Path "$rcliDir\*" -DestinationPath $zipPath -Force

          Write-Host "=== rcli package contents ==="
          Get-ChildItem $rcliDir | ForEach-Object { Write-Host $_.Name }
        shell: powershell

      - name: Upload rcli artifact
        uses: actions/upload-artifact@v4
        with:
          name: rcli-windows-msvc-ninja
          path: ${{ github.workspace }}\rcli-windows-msvc-ninja.zip
          retention-days: 30

      - name: Upload rcli to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}\rcli-windows-msvc-ninja.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
